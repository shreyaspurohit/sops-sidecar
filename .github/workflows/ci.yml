name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tools come from .tool-versions; never download a different Go toolchain.
  GOTOOLCHAIN: local
  # renovate: datasource=github-releases depName=asdf-vm/asdf extractVersion=^v(?<version>.+)$
  ASDF_VERSION: 0.20.2

jobs:
  # The other jobs skip for docs-only changes, and on main when the merged
  # pull request's CI already passed on identical content. A job skipped by its
  # `if:` reports success, so the required checks still pass. The workflow
  # itself always runs, because `paths-ignore` would leave the required checks
  # waiting forever. If this job fails, every gated job runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a pull request's files through the API
      actions: read # look up the merged pull request's CI run
    outputs:
      code: ${{ steps.filter.outputs.code }}
      run: ${{ steps.filter.outputs.code == 'true' && steps.reuse.outputs.reused != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # push events are compared with git, and fetching more needs no credentials
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # "code" is true when any changed file matches every rule: anything
          # outside Markdown, docs/, the *.example walkthroughs and LICENSE.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/*.example'
              - '!LICENSE'
      - id: reuse
        # A squash merge of an up-to-date branch keeps the pull request's tree,
        # so its passing CI run covers this commit. Any mismatch runs CI.
        if: ${{ github.event_name == 'push' && steps.filter.outputs.code == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr_head="$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')"
          if [ -z "${pr_head}" ]; then
            echo "No merged pull request for ${SHA}; running CI."
            exit 0
          fi
          merged_tree="$(gh api "repos/${REPO}/git/commits/${SHA}" --jq .tree.sha)"
          pr_tree="$(gh api "repos/${REPO}/git/commits/${pr_head}" --jq .tree.sha)"
          if [ "${merged_tree}" != "${pr_tree}" ]; then
            echo "${SHA} differs from pull request head ${pr_head}; running CI."
            exit 0
          fi
          conclusion="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${pr_head}&event=pull_request&status=completed" --jq '.workflow_runs[0].conclusion // empty')"
          if [ "${conclusion}" != "success" ]; then
            echo "CI for pull request head ${pr_head} is '${conclusion}'; running CI."
            exit 0
          fi
          echo "Reusing the passing CI run of pull request head ${pr_head}."
          echo "reused=true" >> "${GITHUB_OUTPUT}"

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          asdf_version: ${{ env.ASDF_VERSION }}
      - uses: ./.github/actions/go-cache
      - name: gofumpt
        run: |
          unformatted="$(gofumpt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofumpt would reformat:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - name: go vet
        run: go vet -tags integration ./...
      - name: golangci-lint
        run: golangci-lint run
      - name: staticcheck
        run: go tool staticcheck -tags integration ./...
      - name: deadcode
        # deadcode exits 0 even when it finds something; the script fails on
        # any finding outside the documented redaction-method allowlist.
        run: ./scripts/deadcode.sh

  workflow-lint:
    name: workflow-lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          asdf_version: ${{ env.ASDF_VERSION }}
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: zizmor
        run: scripts/zizmor.sh .github

  test:
    name: test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          asdf_version: ${{ env.ASDF_VERSION }}
      - uses: ./.github/actions/go-cache
      - name: unit tests with coverage gates
        run: ./scripts/coverage.sh
      - name: upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  govulncheck:
    name: govulncheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          asdf_version: ${{ env.ASDF_VERSION }}
      - uses: ./.github/actions/go-cache
      - name: govulncheck
        run: go tool govulncheck ./...

  docker:
    name: docker
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          asdf_version: ${{ env.ASDF_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build both architectures (no push)
        # The Go stage cross-compiles on the runner; no QEMU is needed.
        run: docker buildx build --platform linux/amd64,linux/arm64 .
      - name: load the native image
        run: docker buildx build --load --tag sops-sidecar:scan .
      - name: trivy scan
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed sops-sidecar:scan

  integration:
    # The role, not the version, is in the job name so the required-check name
    # stays stable when Renovate bumps the latest version.
    name: integration (compose ${{ matrix.role }})
    # Gated per step, not per job: a matrix job skipped by a job-level `if:`
    # reports one check with the unexpanded name, so the required checks
    # "integration (compose minimum)" and "(compose latest)" would never report.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deliberate minimum supported Compose version; Renovate must not bump it.
          - role: minimum
            version: v2.20.0
          - role: latest
            # renovate: datasource=github-releases depName=docker/compose
            version: v5.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run == 'true' }}
        with:
          persist-credentials: false
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run == 'true' }}
        with:
          asdf_version: ${{ env.ASDF_VERSION }}
      - uses: ./.github/actions/go-cache
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run == 'true' }}
      - name: build image
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run == 'true' }}
        # The release image is built the same way: a binary compiled outside
        # Docker, packaged by the Dockerfile's prebuilt stage.
        run: |
          ctx="${RUNNER_TEMP}/image"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "${ctx}/linux/amd64/sops-sidecar" ./cmd/sops-sidecar
          docker build --platform linux/amd64 --target prebuilt -f Dockerfile -t sops-sidecar:test "${ctx}"
      - name: integration tests
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run == 'true' }}
        env:
          COMPOSE_VERSION: ${{ matrix.version }}
          SIDECAR_IMAGE: sops-sidecar:test
        run: |
          # A separate assignment, so a failed download fails the step.
          COMPOSE_BIN="$(scripts/fetch-compose.sh "${COMPOSE_VERSION}")"
          export COMPOSE_BIN
          go test -tags integration -count=1 -v ./test/integration/...

  go-cache:
    name: go-cache
    needs: changes
    # Pull requests restore caches saved on main, never each other's, so main
    # refreshes them even when its other jobs are skipped.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          asdf_version: ${{ env.ASDF_VERSION }}
      - uses: ./.github/actions/go-cache
      - name: compile what the other jobs compile
        run: |
          go mod download
          go build tool
          go vet -tags integration ./...
          go test -race -covermode=atomic -run '^$' ./...
          go test -tags integration -run '^$' ./test/integration/...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/sops-sidecar
      - uses: ./.github/actions/go-cache
        with:
          save: "true"
