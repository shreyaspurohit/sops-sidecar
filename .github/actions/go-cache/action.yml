name: Go cache
description: Restores, or saves, the Go module and build caches for the pinned Go version and go.sum.

inputs:
  save:
    description: Save the caches instead of restoring them.
    default: "false"

runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: |
        {
          echo "gomodcache=$(go env GOMODCACHE)"
          echo "gocache=$(go env GOCACHE)"
          echo "prefix=go-$(cat .tool-versions go.sum | sha256sum | cut -c1-16)-"
        } >> "${GITHUB_OUTPUT}"
    - if: ${{ inputs.save != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.gomodcache }}
          ${{ steps.paths.outputs.gocache }}
        key: ${{ steps.paths.outputs.prefix }}${{ github.sha }}
        restore-keys: ${{ steps.paths.outputs.prefix }}
    - if: ${{ inputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.gomodcache }}
          ${{ steps.paths.outputs.gocache }}
        key: ${{ steps.paths.outputs.prefix }}${{ github.sha }}
